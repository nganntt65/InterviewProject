name: Databricks CD Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'databricks_config/databricks_job.json'
      - 'models/**'
      - 'profiles.yml'

jobs:
  refresh_production_dag:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.PROD_DB_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.PROD_DB_TOKEN }}

    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI Tooling
        uses: databricks/setup-cli@v1

      - name: Idempotent Workspace Synchronization
        run: |
          echo "Scanning your cloud architecture for pre-existing jobs..."
          JOB_ID=$(databricks jobs list --output json | jq -r '.jobs[] | select(.settings.name == "iGaming_Medallion_Daily_Pipeline") | .job_id' | head -n 1)
          
          if [ -z "$JOB_ID" ]; then
            echo "🚀 No active workflow matching criteria. Instantiating master build..."
            databricks jobs create --json @databricks_config/databricks_job.json
          else
            echo "🔄 Active workflow detected with system hash ID: $JOB_ID. Executing clean reset..."
            databricks jobs reset --job-id $JOB_ID --json @databricks_config/databricks_job.json
          fi