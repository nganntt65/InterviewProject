name: Analytics Engineering DataOps CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'dbt_igaming_market_share/**'
      - '.github/workflows/**'

jobs:
  validate-transformations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dbt_igaming_market_share

    env:
      DATABRICKS_HOST: ${{ secrets.DBT_PRODUCTION_DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DBT_PRODUCTION_DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DBT_PRODUCTION_DATABRICKS_TOKEN }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Explicitly install the Databricks engine connector
      - name: Install dbt-Databricks Adapter
        run: |
          pip install dbt-databricks

      # Safely write the local target configuration file using sequential echo targets
      - name: Generate Temporary Local dbt Profile
        run: |
          echo "dbt_igaming_market_share:" > ./profiles.yml
          echo "  target: workflow" >> ./profiles.yml
          echo "  outputs:" >> ./profiles.yml
          echo "    workflow:" >> ./profiles.yml
          echo "      type: databricks" >> ./profiles.yml
          echo "      catalog: dev_igaming_events" >> ./profiles.yml
          echo "      schema: cicd" >> ./profiles.yml
          echo "      host: ${{ secrets.PROD_DB_HOST }}" >> ./profiles.yml
          echo "      http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}" >> ./profiles.yml
          echo "      token: ${{ secrets.PROD_DB_TOKEN }}" >> ./profiles.yml
          cat ./profiles.yml
      

      - name: Clean Environment Cache
        run: dbt clean --profiles-dir .

      - name: Fetch Dependency Packages
        run: dbt deps --profiles-dir .

      # Validate SQL compilation maps
      - name: Verify Code Manifest Compilation
        run: dbt compile --profiles-dir . --target workflow

      # Run your custom in-memory logic test matrices
      - name: Execute Logical Unit Tests
        run: dbt test --select "test_type:unit" --profiles-dir . --target workflow