version: 2

models:
  # 🌟 FIXED: Changed raw_payload data_type to variant for proper JSON path resolution
  - name: base_raw_igaming_stream
    description: "Interface proxy model capturing Delta CDF streaming metadata schema for unit testing compatibility."
    columns:
    - name: raw_payload
      data_type: variant # 👈 Changed from string to variant
    - name: ingested_at
      data_type: timestamp
    - name: dbt_updated_at
      data_type: timestamp

  - name: igaming_events
    description: "Primary clean transaction ledger parsed from Bronze. Single parsing boundary for variant objects."
    columns:
      - name: transaction_id
        data_type: string
        description: "Primary key identifier for a discrete transaction."
        tests:
          - unique
          - not_null
      - name: app_user_id
        data_type: string
        description: "Downstream user alignment identifier."
      - name: operator_brand
        data_type: string
        description: "The targeted sportsbook or casino brand (e.g., DraftKings, FanDuel)."
        tests:
          - not_null
      - name: state_code
        data_type: string
        description: "Two-letter US state code indicator."
        tests:
          - not_null
      - name: activity_timestamp
        data_type: timestamp
        description: "The event time parsed into a true timestamp object."
      - name: activity_date
        data_type: date
        description: "Partition-friendly date string derived from the event timestamp."
      - name: user_email_hashed
        data_type: string
        description: "SHA-256 hashed user email string acting as the immutable cross-migration PII anchor."
        tests:
          - not_null

